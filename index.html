<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BO1 Zombies - Port</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #loader {
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2>Cargando motor del juego...</h2>
        <p>Estableciendo entorno seguro con SharedArrayBuffer</p>
    </div>

    <script>
        // Registrar el Service Worker para aplicar los headers localmente
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register('./sw.js').then((reg) => {
                console.log("Service Worker activo:", reg);
                if (!navigator.serviceWorker.controller) {
                    window.location.reload();
                }
            }).catch((err) => {
                console.error("Error al registrar el SW:", err);
            });
        }
    </script>
</body>
</html>
