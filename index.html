# Bo2-cache-storague
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Esto oculta tu dominio de Vercel para que el servidor crea que entras directo -->
    <meta name="referrer" content="no-referrer">
    <title>BO1 Zombies - Port</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Carga directa a vel.gg sin dejar rastro del origen cruzado -->
    <iframe src="https://vel.gg" allow="autoplay; fullscreen; cross-origin-isolated; shared-array-buffer" allowfullscreen></iframe>

    <script>
        // Mantener el Service Worker activo para el manejo de caché y memoria
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register('./sw.js').then((reg) => {
                console.log("Service Worker registrado con éxito:", reg);
            }).catch((err) => {
                console.error("Fallo al registrar el Service Worker:", err);
            });
        }
    </script>
</body>
</html>
